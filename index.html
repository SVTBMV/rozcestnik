<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Rozcestník</title>
<style>
  :root {
    /* Barvy – případně uprav, aby sedly ke zbytku stránek */
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #273449;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: clamp(1.4rem, 5vw, 2rem);
    letter-spacing: .08em;
    margin: 12px 0 28px;
  }
  .group-title {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
    margin: 0 4px 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }
  .grid.single { grid-template-columns: 1fr; }
  .grid.half { grid-template-columns: calc(50% - 7px); justify-content: center; }

  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 160px;
    padding: 18px 10px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
    text-align: center;
  }
  .tile:hover, .tile:focus-visible {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-3px);
    outline: none;
  }
  .tile:active { transform: scale(.97); }

  .badge {
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border-radius: 18px;
    background: rgba(56,189,248,.12);
    color: var(--accent);
  }
  .badge svg {
    width: 34px; height: 34px;
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .label { font-size: clamp(1rem, 4vw, 1.15rem); font-weight: 600; }

  .tile.big {
    min-height: 220px;
    border-color: rgba(56,189,248,.5);
    background: linear-gradient(145deg, #1e293b, #243b55);
  }
  .tile.big .badge { width: 88px; height: 88px; border-radius: 24px; }
  .tile.big .badge svg { width: 48px; height: 48px; }
  .tile.big .label { font-size: clamp(1.3rem, 6vw, 1.7rem); letter-spacing: .04em; }

  @media (min-width: 560px) {
    .tile { min-height: 180px; }
    .tile.big { min-height: 250px; }
  }
  @media (max-width: 340px) {
    .grid, .grid.half { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>ROZCESTNÍK</h1>

    <div class="grid single">
      <a class="tile big" href="https://svtbmv.github.io/TB/">
        <span class="badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 21V11l6 4v-4l6 4V4h5v17z"/>
            <path d="M3 21h18"/>
            <path d="M17.5 8h.01M17.5 12h.01"/>
          </svg>
        </span>
        <span class="label">Výrobní portál</span>
      </a>
    </div>

    <div class="group-title">Denní přehled</div>
    <div class="grid">
      <a class="tile" href="https://svtbmv.github.io/vykony/">
        <span class="badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20v-6M11 20V5M17 20v-9"/>
            <path d="M3 20h18"/>
          </svg>
        </span>
        <span class="label">Libřice</span>
      </a>
      <a class="tile" href="https://svtbmv.github.io/TBDivec/">
        <span class="badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20v-6M11 20V5M17 20v-9"/>
            <path d="M3 20h18"/>
          </svg>
        </span>
        <span class="label">Divec</span>
      </a>
    </div>

    <div class="grid half">
      <a class="tile" href="https://svtbmv.github.io/MP/">
        <span class="badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2.5"/>
            <path d="M3 10h18M8 3v4M16 3v4"/>
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/>
          </svg>
        </span>
        <span class="label">Měsíční přehled</span>
      </a>
    </div>
  </div>
</body>
</html>
